version: '3.8'

services:
  kaoyan-learning:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaoyan_smart_learning
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/kaoyan_learning.db
      - FRONTEND_DIR=/app/frontend
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
